apiVersion: 1

datasources:
  - name: PostgreSQL-Observabilidad
    uid: pg_observabilidad
    type: grafana-postgresql-datasource
    access: proxy
    orgId: 1
    isDefault: true
    editable: false
    url: database:5432
    user: ${GRAFANA_DB_USER}
    database: ${POSTGRES_DB}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400