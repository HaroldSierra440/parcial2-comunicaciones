log_format edge_json escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"xff":"$http_x_forwarded_for",'
    '"host":"$host",'
    '"metodo":"$request_method",'
    '"uri":"$uri",'
    '"args":"$args",'
    '"protocolo":"$server_protocol",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"servicio":"$servicio",'
    '"upgrade":"$http_upgrade",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
  '}';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

client_max_body_size 64m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    absolute_redirect off;

    set $upstream_joomla  joomla:80;
    set $upstream_jupyter jupyter:8888;
    set $upstream_grafana grafana:3000;
    set $servicio "otros";

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/shared/access.json.log edge_json;
    error_log  /var/log/nginx/error.log warn;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_http_version 1.1;

    location = /healthz {
        set $servicio "edge";
        default_type text/plain;
        return 200 "edge-ok\n";
    }

    location = /nginx_status {
        set $servicio "edge";
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    location = /jupyter { return 301 /jupyter/; }

    location /jupyter/ {
        set $servicio "jupyter";
        proxy_pass http://$upstream_jupyter;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering     off;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    location = /grafana { return 301 /grafana/; }

    location = /grafana/ {
        set $servicio "grafana";
        return 302 /grafana/d/parcial2-observabilidad/;
    }

    location /grafana/ {
        set $servicio "grafana";
        proxy_pass http://$upstream_grafana;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location / {
        set $servicio "joomla";
        proxy_pass http://$upstream_joomla;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    error_page 502 503 504 /edge_error.html;
    location = /edge_error.html {
        internal;
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Servicio iniciando</title><body><h1>503</h1></body>';
    }
}